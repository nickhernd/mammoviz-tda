name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # Issue #88: giotto-tda solo publica wheels hasta Python 3.12, asi que la
  # validacion de equivalencia numerica entre backends (gudhi vs giotto-tda)
  # no puede correr en el entorno de desarrollo (3.14). Este job la ejecuta
  # en CI con 3.12, donde ambos backends se instalan a la vez.
  backend-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # giotto-tda 0.6.2 fija scikit-learn==1.3.2, que necesita numpy 1.x; sin
      # estas cotas pip retrocede a versiones sin wheel e intenta compilarlas
      # (y falla). --only-binary hace que un conflicto falle rapido.
      - name: Install both TDA backends
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: "numpy<2" "scikit-learn==1.3.2" "giotto-tda==0.6.2" \
            scipy gudhi persim pytest "opencv-python<4.11" pandas

      - name: Run equivalence tests
        run: pytest tests/test_backend_equivalence.py -v

# mammoviz-tda runtime configuration

[io]
dicom_dir          = "data/samples/case001"
model_path         = "data/models/breast_cnn.onnx"

[tda]
intensity_threshold = 0.85    # voxel intensity threshold for point cloud extraction
max_edge_length     = 5.0     # mm, Vietoris-Rips filtration maximum ε
max_dimension       = 2       # compute H₀, H₁, H₂
min_persistence     = 0.3     # filter out topological noise below this value
max_points          = 50000   # max point cloud size (subsampled if larger)

[nn]
hook_layers         = ["layer3", "layer4"]   # CNN layers to capture for XAI
target_class        = -1                     # -1 = use predicted class for GradCAM

[xai]
umap_neighbors      = 15
umap_min_dist       = 0.1
umap_epochs         = 200

[render]
width               = 1920
height              = 1080
vsync               = true
msaa                = true
ray_step_size       = 0.003   # smaller = better quality, slower
show_gradcam        = true
transfer_fn         = "breast_default"  # "breast_default" | "calcification"
